<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">اتصل بنا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* المتغيرات (الوضع الفاتح - التصميم الأصلي) */
    :root {
      --body-bg: url('https://images.unsplash.com/photo-1612817159949-f0f963a36c08?auto=format&fit=crop&w=1400&q=80');
      --body-color: transparent;
      --header-bg: rgba(0, 0, 0, 0.7);
      --nav-bg: rgba(0, 0, 0, 0.6);
      --main-bg: rgba(0, 0, 0, 0.7);
      --footer-bg: rgba(0, 0, 0, 0.8);
      --text-color: #ffffff;
      --accent-color: #ffcc00;
      --input-bg: #ffffff;
      --input-text: #000000;
    }

    /* المتغيرات (الوضع الداكن - خلفية سوداء) */
    [data-theme="dark"] {
      --body-bg: none;
      --body-color: #000000;
      --header-bg: #111111;
      --nav-bg: #1a1a1a;
      --main-bg: #151515;
      --footer-bg: #0a0a0a;
      --text-color: #e0e0e0;
      --accent-color: #ffcc00;
      --input-bg: #222222;
      --input-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      transition: all 0.3s ease;
    }

    body {
      background: var(--body-bg) no-repeat center center fixed;
      background-size: cover;
      background-color: var(--body-color);
      color: var(--text-color);
      line-height: 1.6;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--header-bg);
      padding: 1.5rem;
    }

    nav {
      background: var(--nav-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      padding: 1rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-color);
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: var(--accent-color);
    }

    /* أزرار التحكم */
    .controls {
      display: flex;
      gap: 10px;
      margin-inline-start: 20px;
    }

    .btn-toggle {
      padding: 5px 12px;
      cursor: pointer;
      border: 1px solid var(--accent-color);
      background: transparent;
      color: var(--accent-color);
      border-radius: 5px;
      font-weight: bold;
    }

    .btn-toggle:hover {
      background: var(--accent-color);
      color: #000;
    }

    main {
      padding: 2rem;
      background-color: var(--main-bg);
      margin: 2rem auto;
      border-radius: 10px;
      max-width: 800px;
      flex: 1;
    }

    .contact-form {
      margin-top: 2rem;
      text-align: initial; /* لضبط اتجاه التسميات حسب اللغة */
    }

    .contact-form label {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .contact-form input, .contact-form textarea {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1.5rem;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 1rem;
      background-color: var(--input-bg);
      color: var(--input-text);
    }

    .contact-form button {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 0.8rem 2rem;
      cursor: pointer;
      font-size: 1.1rem;
      border-radius: 6px;
      font-weight: bold;
      width: 100%;
    }

    /* ================= FOOTER ================= */
    footer {
      background: var(--footer-bg);
      padding: 2rem 1rem;
      margin-top: auto;
    }

    .footer-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-links a:hover {
      color: #fff;
      transform: translateY(-3px);
    }

    @media (max-width: 600px) {
      nav { flex-direction: column; gap: 1rem; }
      .footer-links { gap: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1 data-key="header_title">اتصل بنا</h1>
  </header>

  <nav>
    <a href="Tire.html" data-key="nav_home">الرئيسية</a>
    <a href="Product.html" data-key="nav_products">المنتجات</a>
    <a href="Contact.html" data-key="nav_contact">اتصل بنا</a>
    
    <div class="controls">
      <button class="btn-toggle" onclick="toggleLanguage()" id="langBtn">EN</button>
      <button class="btn-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
  </nav>

  <main>
    <h2 data-key="main_title">نحن هنا للمساعدة!</h2>
    <p data-key="main_desc">إذا كنت بحاجة إلى أي مساعدة أو استفسار، لا تتردد في التواصل معنا.</p>

    <div class="contact-form">
      <form>
        <label for="name" data-key="label_name">اسمك:</label>
        <input type="text" id="name" required>

        <label for="email" data-key="label_email">بريدك الإلكتروني:</label>
        <input type="email" id="email" required>

        <label for="message" data-key="label_message">رسالتك:</label>
        <textarea id="message" rows="6" required></textarea>

        <button type="submit" data-key="btn_send">إرسال</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <p data-key="footer_rights">&copy; 2025 متجر الكاوتش. جميع الحقوق محفوظة.</p>
      <div class="footer-links">
        <a href="tel:01021885140" data-key="footer_call">📞 اتصال</a>
        <a href="mailto:salaheldin200281@gmail.com" data-key="footer_mail">📧 بريد</a>
        <a href="#" data-key="footer_loc">📍 موقعنا</a>
      </div>
    </div>
  </footer>

  <script>
   if (!localStorage.getItem("currentUser")) {
    window.location.href = "login.html"; 
}
    const translations = {
      ar: {
        header_title: "اتصل بنا",
        nav_home: "الرئيسية",
        nav_products: "المنتجات",
        nav_contact: "اتصل بنا",
        main_title: "نحن هنا للمساعدة!",
        main_desc: "إذا كنت بحاجة إلى أي مساعدة أو استفسار، لا تتردد في التواصل معنا.",
        label_name: "اسمك:",
        label_email: "بريدك الإلكتروني:",
        label_message: "رسالتك:",
        btn_send: "إرسال",
        placeholder_name: "اكتب اسمك هنا",
        placeholder_email: "اكتب بريدك الإلكتروني",
        placeholder_message: "اكتب رسالتك هنا",
        footer_rights: "© 2025 متجر الكاوتش. جميع الحقوق محفوظة.",
        footer_call: "📞 اتصال",
        footer_mail: "📧 بريد",
        footer_loc: "📍 موقعنا"
      },
      en: {
        header_title: "Contact Us",
        nav_home: "Home",
        nav_products: "Products",
        nav_contact: "Contact Us",
        main_title: "We're here to help!",
        main_desc: "If you need any help or have an inquiry, feel free to contact us.",
        label_name: "Your Name:",
        label_email: "Your Email:",
        label_message: "Your Message:",
        btn_send: "Send",
        placeholder_name: "Enter your name",
        placeholder_email: "Enter your email",
        placeholder_message: "Write your message here",
        footer_rights: "© 2025 Tire Store. All rights reserved.",
        footer_call: "📞 Call",
        footer_mail: "📧 Email",
        footer_loc: "📍 Our Location"
      }
    };

    let currentLang = 'ar';
    let currentTheme = 'light';

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('langBtn').textContent = currentLang === 'ar' ? 'EN' : 'AR';
      updateUI();
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', currentTheme);
      document.getElementById('themeBtn').textContent = currentTheme === 'light' ? '🌙' : '☀️';
    }

    function updateUI() {
      // تحديث النصوص
      document.querySelectorAll('[data-key]').forEach(elem => {
        const key = elem.getAttribute('data-key');
        elem.textContent = translations[currentLang][key];
      });

      // تحديث الـ Placeholders
      document.getElementById('name').placeholder = translations[currentLang].placeholder_name;
      document.getElementById('email').placeholder = translations[currentLang].placeholder_email;
      document.getElementById('message').placeholder = translations[currentLang].placeholder_message;
      
      // تحديث عنوان الصفحة المتصفح
      document.title = translations[currentLang].header_title;
    }

    // التنفيذ الأول عند التحميل
    updateUI();
  </script>
</body>
</html>
